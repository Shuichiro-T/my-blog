name: ✨ 機能リクエスト
description: サイトに追加・改善したい機能を提案する
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        追加したい機能や改善案を記入してください。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: なぜこの機能が必要か、現状どう困っているかを書いてください。
      placeholder: 例）記事が増えてきたが、タグで絞り込めないため目的の記事を探しにくい
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能
      description: どのような機能・挙動を想定しているかを書いてください。
      placeholder: 例）記事のfrontmatterにtagsを追加し、/tags/:tag で一覧できるページを生成する
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他に考えた方法があれば書いてください。

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 何ができれば完了とみなすかをチェックリストで書いてください。
      value: |
        - [ ]
        - [ ]

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - 高（すぐ対応したい）
        - 中（近いうちに対応したい）
        - 低（いつかできれば）
      default: 1
    validations:
      required: true

  - type: checkboxes
    id: claude
    attributes:
      label: 対応の依頼
      options:
        - label: "@claude に実装を依頼する"
          required: false
